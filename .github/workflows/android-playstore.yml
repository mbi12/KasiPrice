name: Android APK & Google Play Store Bundle

on:
  push:
    branches: ['main', 'arena/9cfa2502-kasiprice']
    paths:
      - 'android/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-playstore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android APK & Play Store AAB
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Install dependencies & verify build
        run: |
          npm ci
          npm test
          npm run android:sync

      - name: Build installable Debug APK & Play Store Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload Android APK (Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: nicole-beauty-parlour-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: nicole-beauty-parlour-playstore-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
